[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paypal-invoice-steward"
version = "0.1.0"  # Single source of truth for the version. See docs/versioning.md
description = "AI agent that chases late PayPal invoices and forecasts cash flow; it proposes, a human confirms."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Himar Bravo Pérez" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17.2",
    "mypy>=1.11",
]

[project.scripts]
paypal-invoice-steward = "paypal_invoice_steward.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paypal_invoice_steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src"]
strict = true
