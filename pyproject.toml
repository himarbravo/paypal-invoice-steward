[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-project"
version = "0.1.0"  # Única fuente de verdad de la versión. Ver docs/versioning.md
description = "Descripción corta del proyecto."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "AUTHOR" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
my-project = "my_project.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src"]
strict = true
