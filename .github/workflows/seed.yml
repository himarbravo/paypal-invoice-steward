name: Seed

# Solo existe en la semilla: scripts/init_project.py borra este archivo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inicializar un proyecto de prueba
        run: python3 scripts/init_project.py demo-app --owner someone --author "Ada" --description "Una demo."
      - name: No quedan restos del nombre provisional
        run: "! grep -rnE 'my[-_]project|My Project|OWNER|\bAUTHOR\b|seed:' --exclude-dir=.git ."
      - run: pip install -e ".[dev]"
      - run: ./scripts/check.sh
      - run: demo-app
